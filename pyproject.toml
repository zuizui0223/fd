[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "external-functional-ecology"
version = "0.2.0"
description = "Independent external database functional ecology; no project-owned island plant DB"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
geo = ["geopandas","pyogrio","shapely","pyproj","pyshp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
