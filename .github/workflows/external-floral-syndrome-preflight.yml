name: External floral syndrome source preflight
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/external_floral_syndrome_preflight.py
      - scripts/external_gift_floral_trait_overlap.py
      - scripts/external_gift_coverage_source_audit.py
      - .github/workflows/external-floral-syndrome-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/external_floral_syndrome_preflight.py --out work/external_floral_preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-floral-source-audit
          path: work/external_floral_preflight.json
      - run: python scripts/external_gift_floral_trait_overlap.py --self-test
      - run: python -u scripts/external_gift_floral_trait_overlap.py --out work/external_gift_floral_trait_overlap.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-gift-floral-trait-overlap
          path: work/external_gift_floral_trait_overlap.json
      - run: python scripts/external_gift_coverage_source_audit.py --self-test
      - run: python -u scripts/external_gift_coverage_source_audit.py --out work/external_gift_coverage_source_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-gift-coverage-source-audit
          path: work/external_gift_coverage_source_audit.json
