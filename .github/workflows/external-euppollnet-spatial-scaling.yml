name: External EuPPollNet spatial scaling and crossed dependence
on:
  pull_request:
    paths:
      - scripts/external_euppollnet_spatial_scaling.py
      - .github/workflows/external-euppollnet-spatial-scaling.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_euppollnet_spatial_scaling.py --self-test
      - run: python -u scripts/external_euppollnet_spatial_scaling.py --out /tmp/spatial.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-euppollnet-spatial-scaling
          path: /tmp/spatial.json
          if-no-files-found: error
