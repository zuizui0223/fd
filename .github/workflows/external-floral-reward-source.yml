name: External measured floral reward source
on:
  push:
    branches: [analysis/floral-reward-functional-bridge-20261127]
    paths:
      - "scripts/external_floral_reward_source.py"
      - ".github/workflows/external-floral-reward-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - run: pip install numpy pandas openpyxl xlrd
      - run: python scripts/external_floral_reward_source.py --self-test --out /tmp/unused.json
      - run: python -u scripts/external_floral_reward_source.py --out /tmp/floral_reward_source.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-floral-reward-source
          path: /tmp/floral_reward_source.json
