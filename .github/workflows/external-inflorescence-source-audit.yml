name: External global inflorescence source audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/external_inflorescence_source_audit.py
      - .github/workflows/external-inflorescence-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyreadr
      - run: python scripts/external_inflorescence_source_audit.py --self-test
      - run: python -u scripts/external_inflorescence_source_audit.py --out work/external_inflorescence_source_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-inflorescence-source-audit
          path: work/external_inflorescence_source_audit.json
