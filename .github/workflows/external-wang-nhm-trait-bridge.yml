name: External Wang NHM trait bridge
on:
  push:
    branches: [analysis/external-floral-replication-intake-20261126]
    paths:
      - "scripts/external_wang_nhm_trait_bridge.py"
      - ".github/workflows/external-wang-nhm-trait-bridge.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/external_wang_nhm_trait_bridge.py
      - .github/workflows/external-wang-nhm-trait-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zuizui0223/fd' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - run: pip install pandas
      - run: python -u scripts/external_wang_nhm_trait_bridge.py --out /tmp/external_wang_nhm_trait_bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-wang-nhm-trait-bridge
          path: /tmp/external_wang_nhm_trait_bridge.json
