name: Independent pollinator guild source intake
on:
  push:
    branches: [analysis/tropical-pollinator-guild-dispersal-20261124]
    paths:
      - scripts/tropical_pollinator_source_intake.py
      - .github/workflows/tropical_pollinator_source_intake.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    strategy:
      fail-fast: false
      matrix:
        stage: [bird, bee]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - run: python scripts/tropical_pollinator_source_intake.py --stage test --out work/guild_intake
      - run: python scripts/tropical_pollinator_source_intake.py --stage ${{ matrix.stage }} --out work/guild_intake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropical-guild-intake-${{ matrix.stage }}
          path: work/guild_intake
