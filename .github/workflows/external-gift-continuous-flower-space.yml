name: External continuous floral functional space
on:
  push:
    branches: [analysis/external-floral-replication-intake-20261126]
    paths:
      - "scripts/external_gift_continuous_flower_space.py"
      - ".github/workflows/external-gift-continuous-flower-space.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - run: pip install numpy scipy pandas
      - run: python scripts/external_gift_continuous_flower_space.py --self-test
      - run: python -u scripts/external_gift_continuous_flower_space.py --out /tmp/external_continuous_space.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-continuous-floral-space
          path: /tmp/external_continuous_space.json
