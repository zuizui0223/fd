name: External EuPollTrait visitor-genus coherent trait null
on:
  pull_request:
    paths:
      - scripts/external_eupolltrait_visitor_genus.py
      - .github/workflows/external-eupolltrait-visitor-genus.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_eupolltrait_visitor_genus.py --self-test
      - run: python -u scripts/external_eupolltrait_visitor_genus.py --out /tmp/visitor_genus.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-eupolltrait-visitor-genus
          path: /tmp/visitor_genus.json
          if-no-files-found: error
