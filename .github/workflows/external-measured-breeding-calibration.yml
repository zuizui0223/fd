name: External measured breeding-system calibration
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/external_measured_breeding_calibration.py
      - scripts/external_breeding_system_source_audit.py
      - .github/workflows/external-measured-breeding-calibration.yml
      - config/external_db_ownership.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas openpyxl
      - run: python scripts/external_measured_breeding_calibration.py --self-test
      - run: python -u scripts/external_measured_breeding_calibration.py --out work/external_measured_breeding_calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-measured-breeding-calibration
          path: work/external_measured_breeding_calibration.json
