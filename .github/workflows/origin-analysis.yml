name: fd geological origin and LGM-connectivity analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and run provenance/origin tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Retrieve source-commit-pinned public trait aggregate inputs
        run: python scripts/fetch_island_aggregates.py --output work/island_public
      - name: Reconstruct floral Rao Q and original-distance comparisons
        run: python -m fd.pipeline --input work/island_public --output work/fd_g0
      - name: Recompute common projected KDE sensitivity
        run: python -m fd.hypervolume --input work/island_public --g0 work/fd_g0 --output work/fd_hv
      - name: Crosswalk verified geological origin and historical mainland connection, then stratify
        run: |
          python -m fd.origin_analysis \
            --g0 work/fd_g0 \
            --hypervolume work/fd_hv \
            --crosswalk work/fd_crosswalk \
            --output results/origin_strata
      - name: Calculate 17D projected Gaussian KDE90 hypervolume with Monte Carlo quality audits
        run: |
          python -m fd.hypervolume17 \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/hypervolume17 \
            --scopes all,direct \
            --samples 12000
      - name: Test geological-origin differences under within-origin fixed-profile margins
        run: |
          python -m fd.origin_null \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/origin_g1 \
            --draws 200
      - name: Test source-regime-matched floral repertoire differences
        run: |
          python -m fd.repertoire \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/origin_repertoire \
            --permutations 9999
      - name: Check stricter covariate matching and separate regions
        run: |
          python -m fd.repertoire_sensitivity \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/origin_repertoire_sensitivity
      - name: Audit historic Tracheophyta GBIF observation effort and repeat matched floral repertoire comparisons
        run: |
          python -m fd.effort_audit \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/gbif_effort_robustness \
            --draws 9999
      - name: Probe geological repertoire support through matched profile/name rarefaction and single-state cohorts
        run: |
          python -m fd.coverage_rarefaction \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/coverage_rarefaction \
            --replications 99 \
            --permutations 1999
      - name: Test pair pseudo-independence using exact spatial-block component sign swaps
        run: |
          python -m fd.spatial_clusters \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --effort results/pinned_prior_gbif_effort.csv \
            --output results/spatial_cluster_dependence
      - name: Maximize geography-disjoint origin matches and test exact category repertoire difference
        run: |
          python -m fd.geography_independent \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/geography_independent
      - name: Rematch geographical origin islands with nonoverlapping spatial blocks and source archipelagos
        run: |
          python -m fd.geography_independent \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/geography_independent
      - name: Cross-validate named archipelago floral repertoires against same-regime and distance-matched outside sources
        run: |
          python -m fd.archipelago_cv \
            --input work/island_public \
            --g0 work/fd_g0 \
            --crosswalk work/fd_crosswalk/island_origin_crosswalk.csv \
            --output results/archipelago_cv \
            --permutations 9999 \
            --bootstrap 4999
      - name: Preserve aggregate results and crosswalk audit without row-level geology joins
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-origin-strata-analysis
          path: |
            results/origin_strata
            results/hypervolume17
            results/origin_g1
            results/origin_repertoire
            results/origin_repertoire_sensitivity
            results/gbif_effort_robustness
            results/coverage_rarefaction
            results/spatial_cluster_dependence
            results/geography_independent
            results/archipelago_cv
            work/fd_crosswalk/crosswalk_audit.json
            work/island_public/source_manifest.json
          retention-days: 30
