name: External EuPPollNet conditional network null
on:
  pull_request:
    paths:
      - scripts/external_euppollnet_curveball.py
      - .github/workflows/external-euppollnet-curveball.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_euppollnet_curveball.py --self-test
      - run: python -u scripts/external_euppollnet_curveball.py --out /tmp/curveball.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-euppollnet-curveball
          path: /tmp/curveball.json
          if-no-files-found: error
