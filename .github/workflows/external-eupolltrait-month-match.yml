name: External EuPollTrait calendar month matched turnover
on:
  pull_request:
    paths:
      - scripts/external_eupolltrait_month_match.py
      - .github/workflows/external-eupolltrait-month-match.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_eupolltrait_month_match.py --self-test
      - run: python -u scripts/external_eupolltrait_month_match.py --out /tmp/month_match.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-eupolltrait-month-match
          path: /tmp/month_match.json
          if-no-files-found: error
