name: External native flora measured reward contrasts
on:
  push:
    branches: [analysis/floral-reward-functional-bridge-20261127]
    paths:
      - "scripts/external_gift_measured_reward.py"
      - ".github/workflows/external-gift-measured-reward.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pandas
      - run: python scripts/external_gift_measured_reward.py --self-test --nectar-column auto
      - run: python -u scripts/external_gift_measured_reward.py --nectar-column auto --out /tmp/gift_measured_reward.json
      - uses: actions/upload-artifact@v4
        with:
          name: gift-measured-reward
          path: /tmp/gift_measured_reward.json
