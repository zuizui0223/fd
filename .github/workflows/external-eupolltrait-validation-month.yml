name: External EuPollTrait validation cohort calendar month audit
on:
  pull_request:
    paths:
      - scripts/external_eupolltrait_validation_month.py
      - .github/workflows/external-eupolltrait-validation-month.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_eupolltrait_validation_month.py --self-test
      - run: python -u scripts/external_eupolltrait_validation_month.py --out /tmp/validation_month.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-eupolltrait-validation-month
          path: /tmp/validation_month.json
          if-no-files-found: error
