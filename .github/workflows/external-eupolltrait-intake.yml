name: External EuPollTrait measured morphology intake
on:
  pull_request:
    paths:
      - scripts/external_eupolltrait_intake.py
      - .github/workflows/external-eupolltrait-intake.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - run: python scripts/external_eupolltrait_intake.py --self-test
      - run: python -u scripts/external_eupolltrait_intake.py --out /tmp/eupolltrait.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-eupolltrait-intake
          path: /tmp/eupolltrait.json
          if-no-files-found: error
