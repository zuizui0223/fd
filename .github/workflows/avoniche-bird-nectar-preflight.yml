name: Independent AVONICHE BirdLife nectar-source preflight

on:
  pull_request:
    paths:
      - '.github/workflows/avoniche-bird-nectar-preflight.yml'
      - 'src/fd/avoniche_nectar_preflight.py'
      - 'tests/test_avoniche_nectar_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-bird-diet-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the fd test environment
        run: python -m pip install -e '.[test]'
      - name: Run strict synthetic species, units and coverage gates
        run: python -m pytest -q tests/test_avoniche_nectar_preflight.py
      - name: Fetch public AVONICHE BirdLife 2020 nectar weights only
        run: python -m fd.avoniche_nectar_preflight --output-dir work/avoniche_public
      - name: Upload source-only CC0 receipt and bird diet weights
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fd-public-avoniche-birdlife2020-nectar-source
          path: work/avoniche_public/
          retention-days: 30
