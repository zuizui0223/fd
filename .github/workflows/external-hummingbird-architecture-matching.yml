name: External hummingbird floral architecture matching
on:
  push:
    branches: [analysis/floral-reward-functional-bridge-20261127]
    paths:
      - "scripts/external_hummingbird_architecture_matching.py"
      - ".github/workflows/external-hummingbird-architecture-matching.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - run: pip install numpy pandas
      - run: python scripts/external_hummingbird_architecture_matching.py --self-test
      - run: python -u scripts/external_hummingbird_architecture_matching.py --out /tmp/hummingbird_architecture_matching.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-hummingbird-architecture-matching
          path: /tmp/hummingbird_architecture_matching.json
