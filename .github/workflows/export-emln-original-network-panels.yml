name: fd source-pinned EMLN original island and temporal network export

on:
  push:
    branches: [analysis/pollinator-loss-functional-assembly-20261113]
    paths: ['.github/workflows/export-emln-original-network-panels.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/checkout@v4
        with:
          repository: Ecological-Complexity-Lab/emln
          ref: e66e8702910728358e71f7814d01afd3c7b00c30
          path: source-emln
          persist-credentials: false
      - name: Export original CC-BY-4.0 source-format network tables
        run: |
          set -euo pipefail
          mkdir -p /tmp/fd-emln-original
          Rscript - <<'RS'
          ids=c(60,71,64,72)
          for (i in ids) {
            source=list.files('source-emln/data',pattern=paste0('^emln',i,'_.*\\.rda$'),
                              full.names=TRUE)
            stopifnot(length(source)==1)
            e=new.env(parent=emptyenv())
            obj=get(load(source,envir=e)[1],envir=e)
            stopifnot(all(c('nodes','layers','interactions') %in% names(obj)))
            prefix=paste0('/tmp/fd-emln-original/emln',i)
            write.csv(obj$nodes,paste0(prefix,'_nodes.csv'),row.names=FALSE)
            write.csv(obj$layers,paste0(prefix,'_layers.csv'),row.names=FALSE)
            write.csv(obj$interactions,paste0(prefix,'_interactions.csv'),row.names=FALSE)
            cat('EMLN original network',i,':',
              length(unique(obj$layers$layer)),'layers',
              length(unique(obj$nodes$node_id)),'nodes',
              length(unique(obj$interactions$interaction_id)),'source link rows','\n')
          }
          RS
          sha256sum source-emln/data/emln60_spatial_trojelsgaard_2015.rda
          sha256sum source-emln/data/emln71_temporal_perturbation_kaiser_bunbury_2009.rda
          sha256sum source-emln/data/emln64_temporal_caradona_2020.rda
          sha256sum source-emln/data/emln72_temporal_ponisio_2017.rda
      - uses: actions/upload-artifact@v4
        with:
          name: fd-emln-source-ccby-${{ github.run_id }}
          path: /tmp/fd-emln-original/*.csv
          if-no-files-found: error
          retention-days: 90
