name: fd functional-trait readiness and public GBIF turnover audit

on:
  pull_request:
    paths:
      - 'src/fd/functional_*.py'
      - 'tests/test_functional_*.py'
      - 'tests/test_public_island_taxon_frequency.py'
      - 'scripts/audit_public_island_taxon_frequency.py'
      - '.github/workflows/functional-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fd analysis code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analytic and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run rights-safe module tests (synthetic inputs only)
        run: |
          python -m pytest -q tests/test_functional_turnover.py tests/test_functional_matched.py tests/test_functional_rarefaction.py tests/test_public_island_taxon_frequency.py
      - name: Read only pinned PUBLIC GBIF taxon frequency files from upstream island
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/island
          ref: 3bfa818ffbc7a0dea4319933c4b0a0eb41cfabb5
          path: work/pinned_island_public
          persist-credentials: false
          sparse-checkout: |
            data/v2/staging/gbif/collected/island_taxa.csv
            data/v2/staging/gbif/collected/collection_status.json
          sparse-checkout-cone-mode: false
      - name: Calculate public recording-frequency baseline and check frozen counts
        run: |
          python scripts/audit_public_island_taxon_frequency.py \
            --taxa work/pinned_island_public/data/v2/staging/gbif/collected/island_taxa.csv \
            --status work/pinned_island_public/data/v2/staging/gbif/collected/collection_status.json \
            --output work/functional_public_frequency.json
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path('work/functional_public_frequency.json').read_text())
          frozen=json.loads(Path('results/20261110_functional_turnover_readiness/public_island_taxon_frequency.json').read_text())
          for key in ('n_accepted_taxon_names','n_island_taxon_occurrences',
                      'n_islands_with_any_record','n_source_blocks',
                      'taxa_recorded_on_one_island','island_count_by_taxon_recording_frequency',
                      'median_recorded_islands_per_taxon','p90_recorded_islands_per_taxon',
                      'p99_recorded_islands_per_taxon','max_recorded_islands_per_taxon'):
              if got[key]!=frozen[key]:
                  raise SystemExit(f'Frozen public taxon frequency differs in {key}')
          print('Public, source-pinned taxon-frequency counts verified')
          PY
      - name: Save aggregate baseline only — no raw flora/trait ledgers
        uses: actions/upload-artifact@v4
        with:
          name: fd-public-functional-readiness
          path: work/functional_public_frequency.json
          retention-days: 30
